<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LEEPLUS Staff Dashboard</title>
<style>
:root{--bg:#FFFDF7;--card:#fff;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--yellow:#F7C948;--yellowSoft:#FFF4CC;--greenSoft:#DCFCE7;--redSoft:#FEE2E2;--blueSoft:#DBEAFE;--purpleSoft:#EDE9FE;--shadow:0 12px 32px rgba(17,24,39,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#FFF4CC 0,#FFFDF7 42%,#FFFDF7 100%);color:var(--text)}
.wrap{max-width:1160px;margin:auto;padding:18px 14px 42px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--yellow),#FFE08A);font-weight:1000;font-size:20px;box-shadow:0 10px 22px rgba(247,201,72,.28);flex:0 0 auto}.title{font-size:22px;font-weight:1000;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.refreshBtn{min-height:42px;border:0;border-radius:14px;padding:0 14px;background:#111827;color:#fff;font-size:13px;font-weight:900;cursor:pointer}
.activeBox{background:#111827;color:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.activeLabel{font-size:12px;font-weight:1000;color:#FDE68A}.activeName{font-size:20px;font-weight:1000;margin-top:4px;line-height:1.2}.activeMeta{font-size:12px;font-weight:700;color:rgba(255,255,255,.72);margin-top:6px}
.searchBar{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:14px 0}input,select{width:100%;min-height:46px;border:1px solid var(--border);border-radius:16px;padding:0 14px;background:#fff;font-size:15px;font-weight:800;outline:none}input:focus,select:focus{border-color:#F59E0B;box-shadow:0 0 0 4px rgba(247,201,72,.22)}
.statGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:var(--shadow)}.statLabel{font-size:11px;font-weight:1000;color:#92400E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statValue{font-size:28px;font-weight:1000;margin-top:4px;line-height:1}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;margin-bottom:2px}.tab{flex:0 0 auto;border:1px solid var(--border);background:#fff;color:#374151;border-radius:999px;min-height:38px;padding:0 14px;font-size:13px;font-weight:1000;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.list{display:grid;gap:10px}.personCard{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}.personRow{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(390px,2.4fr) auto;gap:12px;align-items:center}.personName{font-size:17px;font-weight:1000;line-height:1.25}.personPhone{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px}.statusLine{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;padding-bottom:2px}.primaryStatus{display:flex;gap:6px;flex-wrap:nowrap;min-width:0}.moreText{font-size:11px;font-weight:1000;color:#6B7280;white-space:nowrap;align-self:center}.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:1000;border:1px solid transparent;white-space:nowrap}.approved{background:var(--greenSoft);color:#166534;border-color:#BBF7D0}.pending{background:var(--yellowSoft);color:#92400E;border-color:#FDE68A}.rejected{background:var(--redSoft);color:#991B1B;border-color:#FECACA}.checked{background:var(--blueSoft);color:#1D4ED8;border-color:#BFDBFE}.refund{background:#ECFDF5;color:#047857;border-color:#A7F3D0}.notRefund{background:#FEF3C7;color:#92400E;border-color:#FDE68A}.gift{background:var(--purpleSoft);color:#5B21B6;border-color:#DDD6FE}.problem{background:var(--redSoft);color:#991B1B;border-color:#FECACA}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap;margin-top:0}.btn{min-height:40px;border:0;border-radius:13px;font-size:12px;font-weight:1000;cursor:pointer;padding:0 10px;white-space:nowrap}.btnSlip{background:#111827;color:#fff}.btnApprove{background:linear-gradient(180deg,#22C55E,#16A34A);color:#052e16}.btnReject{background:linear-gradient(180deg,#EF4444,#DC2626);color:#fff}.btnNote{background:#F3F4F6;color:#374151;border:1px solid #E5E7EB}.msg{font-size:13px;font-weight:900;color:#92400E;min-height:20px;margin:8px 0}.empty{background:#fff;border:1px dashed #D1D5DB;border-radius:18px;padding:22px;text-align:center;color:#6B7280;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:99;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalCard{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:0 28px 90px rgba(0,0,0,.30)}.modalHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.modalTitle{font-size:20px;font-weight:1000;line-height:1.2}.closeBtn{border:0;background:#F3F4F6;border-radius:12px;min-width:40px;min-height:40px;font-size:18px;font-weight:1000;cursor:pointer}.detailGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.detailItem{background:#F9FAFB;border:1px solid #EEF2F7;border-radius:16px;padding:11px 12px}.k{font-size:10px;font-weight:1000;color:var(--muted)}.v{font-size:13px;font-weight:1000;margin-top:2px;word-break:break-word}.slipBox{margin-top:12px;border:1px dashed #D1D5DB;border-radius:18px;padding:14px;background:#F9FAFB;text-align:center}.slipImg{max-width:100%;max-height:360px;border-radius:14px;border:1px solid #E5E7EB;background:#fff}.modalActions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
@media(max-width:820px){.statGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.personRow{grid-template-columns:1fr;gap:10px}.actions{justify-content:flex-start}.statusLine{overflow:auto}.searchBar{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:14px 10px 32px}.title{font-size:19px}.logo{width:44px;height:44px;border-radius:15px}.activeName{font-size:18px}.statGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.statValue{font-size:24px}.personCard{padding:12px}.detailGrid,.modalActions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="brand"><div class="logo">LP</div><div><div class="title">Staff Dashboard</div><div class="sub">ดูรายชื่อลงทะเบียนแบบไม่ต้องเปิดชีต</div></div></div><button class="refreshBtn" id="refreshBtn">รีเฟรช</button></div>
  <div class="activeBox"><div><div class="activeLabel">ACTIVE EVENT</div><div class="activeName" id="activeName">กำลังโหลด...</div><div class="activeMeta" id="activeMeta">-</div></div><div class="badge approved">● พร้อมใช้งาน</div></div>
  <div class="statGrid"><div class="stat"><div class="statLabel">ทั้งหมด</div><div class="statValue" id="sTotal">0</div></div><div class="stat"><div class="statLabel">รอตรวจ</div><div class="statValue" id="sPending">0</div></div><div class="stat"><div class="statLabel">อนุมัติ</div><div class="statValue" id="sApproved">0</div></div><div class="stat"><div class="statLabel">เช็คอิน</div><div class="statValue" id="sChecked">0</div></div><div class="stat"><div class="statLabel">คืนเงินแล้ว</div><div class="statValue" id="sRefunded">0</div></div><div class="stat"><div class="statLabel">รับเสื้อแล้ว</div><div class="statValue" id="sGift">0</div></div></div>
  <div class="searchBar"><input id="searchInput" placeholder="ค้นหาชื่อ / เบอร์ / รหัสรับสิทธิ์" /><select id="quickFilter"><option value="all">ทั้งหมด</option><option value="pending">เฉพาะรอตรวจ</option><option value="approved">เฉพาะอนุมัติแล้ว</option><option value="not_checkin">เฉพาะยังไม่เช็คอิน</option><option value="checked">เฉพาะเช็คอินแล้ว</option><option value="slip_problem">เฉพาะสลิปมีปัญหา</option></select></div>
  <div class="tabs" id="tabs"><button class="tab active" data-filter="all">ทั้งหมด</button><button class="tab" data-filter="pending">รอตรวจ</button><button class="tab" data-filter="approved">อนุมัติแล้ว</button><button class="tab" data-filter="checked">เช็คอินแล้ว</button><button class="tab" data-filter="not_refunded">ยังไม่คืนเงิน</button><button class="tab" data-filter="not_gift">ยังไม่รับเสื้อ</button><button class="tab" data-filter="slip_problem">สลิปมีปัญหา</button></div>
  <div class="msg" id="msg"></div><div class="list" id="list"></div>
</div>
<div class="modal" id="detailModal"><div class="modalCard"><div class="modalHead"><div><div class="modalTitle" id="modalName">รายละเอียดผู้ลงทะเบียน</div><div class="personPhone" id="modalSub">-</div></div><button class="closeBtn" onclick="closeModal()">×</button></div><div class="detailGrid" id="detailGrid"></div><div class="slipBox" id="slipBox">ไม่มีสลิป</div><div class="modalActions"><button class="btn btnApprove" onclick="updateStatus('approved')">อนุมัติ</button><button class="btn btnReject" onclick="updateStatus('rejected')">ไม่ผ่าน</button><button class="btn btnNote" onclick="closeModal()">ปิด</button></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";
const STAFF_TOKEN="LEEPLUS_CHECKIN_2026";let allItems=[],currentFilter="all",currentItem=null;const $=id=>document.getElementById(id);
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function money(n){n=Number(n||0);return"฿"+n.toLocaleString("th-TH")}function setMsg(t){$("msg").textContent=t||""}
async function api(params){const url=API_URL+"?"+new URLSearchParams({...params,t:Date.now()}).toString();const res=await fetch(url);const txt=await res.text();try{return JSON.parse(txt)}catch(e){throw new Error("API ไม่ได้ตอบ JSON: "+txt.slice(0,80))}}
function badgeClassStatus(s){s=String(s||"pending").toLowerCase();if(s==="approved")return"approved";if(s==="rejected")return"rejected";return"pending"}function yes(v){return String(v||"").toUpperCase()}
function matchesFilter(x){const q=$("searchInput").value.trim().toLowerCase();const reg=String(x.reg_status||"pending").toLowerCase();const check=yes(x.checkin_status);const refund=yes(x.refund_status);const gift=yes(x.gift_status);const slip=String(x.slip_check_status||"").toUpperCase();const filter=currentFilter;if(q){const hay=[x.final_name,x.phone,x.claim_code,x.group_ref,x.facebook,x.lineId].join(" ").toLowerCase();if(!hay.includes(q))return false}if(filter==="pending")return reg==="pending";if(filter==="approved")return reg==="approved";if(filter==="checked")return check==="CHECKED_IN";if(filter==="not_checkin")return check!=="CHECKED_IN";if(filter==="not_refunded")return x.payment_type!=="COURSE_FEE"&&check==="CHECKED_IN"&&refund!=="REFUNDED";if(filter==="not_gift")return check==="CHECKED_IN"&&gift!=="RECEIVED";if(filter==="slip_problem")return["FAIL","WARNING","RECHECK"].includes(slip)||reg==="rejected";return true}
function renderStats(s){$("sTotal").textContent=s.total||0;$("sPending").textContent=s.pending||0;$("sApproved").textContent=s.approved||0;$("sChecked").textContent=s.checked_in||0;$("sRefunded").textContent=s.refunded||0;$("sGift").textContent=s.gift_received||0}
function renderList(){const rows=allItems.filter(matchesFilter);const list=$("list");if(!rows.length){list.innerHTML='<div class="empty">ไม่พบรายการที่ตรงกับเงื่อนไข</div>';return}list.innerHTML=rows.map(x=>{const reg=String(x.reg_status||"pending").toLowerCase();const checked=yes(x.checkin_status)==="CHECKED_IN";const refundText=x.payment_type==="COURSE_FEE"?"ไม่คืนเงิน":(yes(x.refund_status)==="REFUNDED"?"คืนแล้ว":"รอคืน");const giftText=yes(x.gift_status)==="RECEIVED"?"รับเสื้อ":"ยังไม่รับเสื้อ";const slipText=x.slip_check_status?x.slip_check_status:"SLIP";const amount=money(x.deposit||0);return `<div class="personCard"><div class="personRow"><div><div class="personName">${esc(x.final_name||"-")}</div><div class="personPhone">${esc(x.phone||"-")} ${x.group_ref?"· "+esc(x.group_ref):""}</div></div><div class="statusLine"><div class="primaryStatus"><span class="badge ${badgeClassStatus(reg)}">${esc(reg)}</span><span class="badge ${checked?'checked':'notRefund'}">${checked?'CHECKED_IN':'ยังไม่เช็คอิน'}</span><span class="badge gift">${esc(x.shirt_size||"-")}</span><span class="badge refund">${amount}</span></div><span class="moreText">+ ${esc(refundText)} · ${esc(giftText)} · ${esc(slipText)} ${x.checkin_time?'· '+esc(x.checkin_time):''}</span></div><div class="actions"><button class="btn btnSlip" onclick="openModal(${x.row})">รายละเอียด</button>${reg!=="approved"?`<button class="btn btnApprove" onclick="quickStatus(${x.row},'approved')">อนุมัติ</button>`:""}</div></div></div>`}).join("")}
function openModal(row){currentItem=allItems.find(x=>Number(x.row)===Number(row));if(!currentItem)return;const x=currentItem;$("modalName").textContent=x.final_name||"-";$("modalSub").textContent=`${x.phone||"-"} · Row ${x.row}`;const items=[["สถานะ",x.reg_status],["เช็คอิน",x.checkin_status||"-"],["รหัสรับสิทธิ์",x.claim_code||"-"],["ไซส์เสื้อ",x.shirt_size||"-"],["ยอดชำระ",money(x.deposit||0)],["ประเภทชำระ",x.payment_type||"-"],["คืนเงิน",x.refund_status||"-"],["รับเสื้อ",x.gift_status||"-"],["Facebook",x.facebook||"-"],["Line ID",x.lineId||"-"],["สลิป",x.slip_check_status||"-"],["หมายเหตุ",x.slip_check_note||"-"]];$("detailGrid").innerHTML=items.map(([k,v])=>`<div class="detailItem"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");if(x.preview_url){$("slipBox").innerHTML=`<img class="slipImg" src="${esc(x.preview_url)}" alt="slip"><br><br><a href="${esc(x.file_url||x.preview_url)}" target="_blank">เปิดสลิปใน Google Drive</a>`}else if(x.file_url){$("slipBox").innerHTML=`<a href="${esc(x.file_url)}" target="_blank">เปิดสลิปใน Google Drive</a>`}else{$("slipBox").textContent="ไม่มีสลิป"}$("detailModal").classList.add("show")}
function closeModal(){$("detailModal").classList.remove("show");currentItem=null}async function updateStatus(status){if(!currentItem)return;await quickStatus(currentItem.row,status);closeModal()}
async function quickStatus(row,status){if(!confirm(status==="approved"?"อนุมัติรายการนี้?":"ตั้งเป็นไม่ผ่าน?"))return;setMsg("กำลังบันทึก...");const data=await api({action:"staff_update_status",staff_token:STAFF_TOKEN,row,status});if(!data.ok){alert(data.message||"บันทึกไม่สำเร็จ");setMsg("");return}await loadData()}
async function loadData(){setMsg("กำลังโหลดข้อมูล...");const data=await api({action:"staff_dashboard_list",staff_token:STAFF_TOKEN});if(!data.ok)throw new Error(data.message||"โหลดไม่สำเร็จ");allItems=data.items||[];const ev=data.event||{};$("activeName").textContent=ev.event_name||ev.event_id||"Active Event";$("activeMeta").textContent=`${ev.reg_sheet||data.sheet_name||"-"} · ${allItems.length} รายการ`;renderStats(data.summary||{});renderList();setMsg("พร้อมใช้งาน")}
$("refreshBtn").onclick=()=>loadData().catch(e=>setMsg(e.message));$("searchInput").addEventListener("input",renderList);$("quickFilter").addEventListener("change",e=>{currentFilter=e.target.value;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.filter===currentFilter));renderList()});$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;currentFilter=b.dataset.filter;$("quickFilter").value=currentFilter;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderList()});loadData().catch(e=>setMsg(e.message));
</script>
</body>
</html>
