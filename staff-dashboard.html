<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Staff Dashboard - ตรวจสลิป</title>
  <style>
    :root{--bg:#FFFDF7;--card:#fff;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--yellow:#F7C948;--yellow2:#FFF4CC;--green:#16A34A;--red:#DC2626;--orange:#EA580C;--blue:#2563EB;--shadow:0 10px 28px rgba(17,24,39,.08);--r:18px}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,253,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(229,231,235,.8)}
    .topbar-inner{max-width:1180px;margin:auto;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{display:block;font-size:16px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .wrap{max-width:1180px;margin:auto;padding:14px}.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.sum{border:1px solid var(--border);border-radius:16px;background:#fff;padding:12px}.sum small{font-size:11px;color:var(--muted);font-weight:900}.sum b{display:block;font-size:22px;margin-top:4px}.tools{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;font-size:12px;color:#374151;font-weight:900;margin-bottom:6px}input,select{width:100%;border:1px solid var(--border);border-radius:14px;padding:11px 12px;font-size:14px;background:#fff}button{border:0;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:900;cursor:pointer}.btn-primary{background:linear-gradient(180deg,var(--yellow),#FFE08A);color:#111827;box-shadow:0 8px 16px rgba(247,201,72,.25)}.btn-ghost{background:#fff;border:1px solid var(--border);color:#374151}.msg{font-size:13px;font-weight:800;margin:8px 0 0}.msg.err{color:#B00020}.msg.ok{color:#166534}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.card.problem{border-color:rgba(220,38,38,.45)}.card.pass{border-color:rgba(22,163,74,.35)}.card-head{padding:13px 14px;background:linear-gradient(180deg,rgba(255,244,204,.5),rgba(255,255,255,.9));border-bottom:1px solid rgba(229,231,235,.75);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:1000;font-size:15px}.sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:1000;border:1px solid rgba(0,0,0,.08);white-space:nowrap}.badge .dot{width:7px;height:7px;border-radius:999px}.b-yellow{background:#FEF3C7;color:#92400E}.b-yellow .dot{background:#F59E0B}.b-green{background:#DCFCE7;color:#166534}.b-green .dot{background:#16A34A}.b-red{background:#FEE2E2;color:#991B1B}.b-red .dot{background:#DC2626}.b-orange{background:#FFEDD5;color:#9A3412}.b-orange .dot{background:#EA580C}.b-blue{background:#DBEAFE;color:#1E40AF}.b-blue .dot{background:#2563EB}.b-gray{background:#F3F4F6;color:#374151}.b-gray .dot{background:#6B7280}.body{padding:13px 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{border:1px solid rgba(229,231,235,.85);border-radius:14px;padding:9px 10px;background:#fff}.k{font-size:11px;color:var(--muted);font-weight:900}.v{font-size:13px;font-weight:900;margin-top:3px;word-break:break-word}.note{margin-top:9px;padding:10px 12px;border-radius:14px;background:#F9FAFB;border:1px solid var(--border);font-size:12px;color:#374151;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{width:auto}.approve{background:#16A34A;color:#fff}.reject{background:#DC2626;color:#fff}.pending{background:#F59E0B;color:#111827}.open{background:#111827;color:#fff;text-decoration:none;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:900;display:inline-flex}.empty{padding:28px;text-align:center;color:var(--muted);font-weight:900}.hidden{display:none!important}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.topbar-inner{align-items:flex-start}.badges{justify-content:flex-start}.card-head{flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.sum b{font-size:18px}.actions button,.open{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner"><div class="brand"><b>Staff Dashboard</b><span>ตรวจรายชื่อ / สลิป / อนุมัติรายการ</span></div><button class="btn-primary" onclick="loadData()">รีเฟรช</button></div></div>
  <div class="wrap">
    <div class="panel summary" id="summary"><div class="sum"><small>ทั้งหมด</small><b>-</b></div><div class="sum"><small>รอตรวจ</small><b>-</b></div><div class="sum"><small>อนุมัติ</small><b>-</b></div><div class="sum"><small>ไม่ผ่าน</small><b>-</b></div><div class="sum"><small>เช็กอิน</small><b>-</b></div><div class="sum"><small>สลิปมีปัญหา</small><b>-</b></div></div>
    <div class="panel"><div class="tools"><div><label>ค้นหา</label><input id="q" placeholder="ชื่อ / เบอร์ / Facebook / group_ref" oninput="render()"></div><div><label>สถานะอนุมัติ</label><select id="statusFilter" onchange="render()"><option value="">ทั้งหมด</option><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่ผ่าน</option></select></div><div><label>สถานะสลิป</label><select id="slipFilter" onchange="render()"><option value="">ทั้งหมด</option><option value="PASS_BASIC">ผ่านเบื้องต้น</option><option value="WAITING_CHECK">รอตรวจ</option><option value="AMOUNT_MISMATCH">ยอดไม่ตรง</option><option value="FILE_ERROR">ไฟล์มีปัญหา</option><option value="NEED_RESUBMIT">ขอส่งใหม่</option><option value="REJECTED">ไม่ผ่าน</option></select></div><button class="btn-ghost" onclick="clearFilters()">ล้างตัวกรอง</button></div><p id="msg" class="msg"></p></div>
    <div id="list" class="list"></div>
  </div>
<script>
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";
  var STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";
  var DATA = [];
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(n){n=Number(String(n||0).replace(/[^0-9.]/g,''))||0;return '฿'+n.toLocaleString('th-TH')}
  async function api(params){var url=WEB_APP_URL+'?'+new URLSearchParams(Object.assign({t:Date.now()},params)).toString();var r=await fetch(url);var txt=await r.text();try{return JSON.parse(txt)}catch(e){throw new Error(txt.slice(0,160))}}
  function slipBadge(st){st=String(st||'WAITING_CHECK').toUpperCase(); if(st==='PASS_BASIC')return '<span class="badge b-green"><span class="dot"></span>ผ่านเบื้องต้น</span>'; if(st==='AMOUNT_MISMATCH')return '<span class="badge b-red"><span class="dot"></span>ยอดไม่ตรง</span>'; if(st==='FILE_ERROR')return '<span class="badge b-red"><span class="dot"></span>ไฟล์มีปัญหา</span>'; if(st==='NEED_RESUBMIT')return '<span class="badge b-orange"><span class="dot"></span>ขอส่งใหม่</span>'; if(st==='APPROVED')return '<span class="badge b-blue"><span class="dot"></span>สลิปอนุมัติ</span>'; if(st==='REJECTED')return '<span class="badge b-red"><span class="dot"></span>สลิปไม่ผ่าน</span>'; return '<span class="badge b-yellow"><span class="dot"></span>รอตรวจสลิป</span>'}
  function approveBadge(st){st=String(st||'pending').toLowerCase(); if(st==='approved')return '<span class="badge b-green"><span class="dot"></span>อนุมัติแล้ว</span>'; if(st==='rejected')return '<span class="badge b-red"><span class="dot"></span>ไม่ผ่าน</span>'; return '<span class="badge b-yellow"><span class="dot"></span>รออนุมัติ</span>'}
  function checkBadge(st){st=String(st||'').toUpperCase(); return st==='CHECKED_IN'?'<span class="badge b-blue"><span class="dot"></span>เช็กอินแล้ว</span>':'<span class="badge b-gray"><span class="dot"></span>ยังไม่เช็กอิน</span>'}
  function rowClass(item){var s=String(item.slip_check_status||'').toUpperCase(); if(['AMOUNT_MISMATCH','FILE_ERROR','NEED_RESUBMIT','REJECTED'].includes(s))return ' problem'; if(s==='PASS_BASIC')return ' pass'; return ''}
  async function loadData(){el('msg').className='msg';el('msg').textContent='กำลังโหลดข้อมูล...';try{var res=await api({action:'staff_dashboard_list',staff_token:STAFF_TOKEN}); if(!res.ok)throw new Error(res.message||'โหลดไม่สำเร็จ'); DATA=res.items||[]; renderSummary(res.summary||{}); el('msg').className='msg ok'; el('msg').textContent='โหลดข้อมูลแล้ว '+DATA.length+' รายการ'; render()}catch(e){el('msg').className='msg err';el('msg').textContent='โหลดไม่ได้: '+e.message}}
  function renderSummary(s){el('summary').innerHTML=['total','pending','approved','rejected','checked_in','slip_problem'].map(function(k,i){var labels=['ทั้งหมด','รอตรวจ','อนุมัติ','ไม่ผ่าน','เช็กอิน','สลิปมีปัญหา'];return '<div class="sum"><small>'+labels[i]+'</small><b>'+(s[k]||0)+'</b></div>'}).join('')}
  function getFiltered(){var q=el('q').value.trim().toLowerCase();var sf=el('statusFilter').value;var sl=el('slipFilter').value;return DATA.filter(function(x){var hay=[x.final_name,x.phone,x.facebook,x.lineId,x.group_ref,x.group_leader_phone].join(' ').toLowerCase(); if(q && hay.indexOf(q)===-1)return false; if(sf && String(x.reg_status||'').toLowerCase()!==sf)return false; if(sl && String(x.slip_check_status||'').toUpperCase()!==sl)return false; return true})}
  function render(){var arr=getFiltered(); if(!arr.length){el('list').innerHTML='<div class="panel empty">ไม่พบรายการตามตัวกรอง</div>';return} el('list').innerHTML=arr.map(cardHtml).join('')}
  function cardHtml(x){var slipUrl=x.preview_url||x.file_url||'';var amount=x.deposit||x.payment_total||0;return '<div class="card'+rowClass(x)+'"><div class="card-head"><div><div class="title">'+esc(x.final_name)+'</div><div class="sub">โทร '+esc(x.phone||'-')+' · แถว '+esc(x.row)+' · '+esc(x.group_ref||'เดี่ยว')+'</div></div><div class="badges">'+slipBadge(x.slip_check_status)+approveBadge(x.reg_status)+checkBadge(x.checkin_status)+'</div></div><div class="body"><div class="grid"><div class="cell"><div class="k">Facebook</div><div class="v">'+esc(x.facebook||'-')+'</div></div><div class="cell"><div class="k">Line</div><div class="v">'+esc(x.lineId||'-')+'</div></div><div class="cell"><div class="k">ยอด/มัดจำ</div><div class="v">'+money(amount)+'</div></div><div class="cell"><div class="k">ไซส์เสื้อ</div><div class="v">'+esc(x.shirt_size||'-')+'</div></div><div class="cell"><div class="k">กลุ่ม</div><div class="v">'+esc(x.group_size||'-')+' คน</div></div><div class="cell"><div class="k">หัวหน้ากลุ่ม</div><div class="v">'+esc(x.group_leader_phone||'-')+'</div></div><div class="cell"><div class="k">ประเภทจ่าย</div><div class="v">'+esc(x.payment_type||'-')+'</div></div><div class="cell"><div class="k">รหัสรับสิทธิ์</div><div class="v">'+esc(x.claim_code||'-')+'</div></div></div>'+ (x.slip_check_note?'<div class="note">หมายเหตุสลิป: '+esc(x.slip_check_note)+'</div>':'') +'<div class="actions">'+(slipUrl?'<a class="open" target="_blank" href="'+esc(slipUrl)+'">เปิดดูสลิป</a>':'<button class="btn-ghost" disabled>ไม่มีสลิป</button>')+'<button class="approve" onclick="updateStatus('+x.row+',\'approved\')">อนุมัติ</button><button class="reject" onclick="updateStatus('+x.row+',\'rejected\')">ไม่ผ่าน</button><button class="pending" onclick="updateStatus('+x.row+',\'pending\')">รอตรวจ</button></div></div></div>'}
  async function updateStatus(row,status){var note=''; if(status==='rejected') note=prompt('ใส่หมายเหตุไม่ผ่าน (เว้นว่างได้)','')||''; try{var res=await api({action:'staff_update_status',staff_token:STAFF_TOKEN,row:row,status:status,note:note}); if(!res.ok)throw new Error(res.message||'อัปเดตไม่สำเร็จ'); el('msg').className='msg ok'; el('msg').textContent='อัปเดตแถว '+row+' แล้ว'; await loadData()}catch(e){el('msg').className='msg err';el('msg').textContent=e.message}}
  function clearFilters(){el('q').value='';el('statusFilter').value='';el('slipFilter').value='';render()}
  loadData();
</script>
</body>
</html>
