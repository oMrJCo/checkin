<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Staff Dashboard v8 Gemini Slip Check</title>
  <style>
    :root{
      --bg:#f8f6ef;--card:#ffffff;--ink:#101827;--muted:#667085;--line:#e7e3da;
      --dark:#101827;--yellow:#ffd45a;--yellow2:#fff6d8;--green:#16a34a;--red:#dc2626;
      --orange:#f59e0b;--blue:#2563eb;--gray:#64748b;--shadow:0 12px 34px rgba(16,24,39,.08);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(248,246,239,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,227,218,.8)}
    .topbar-inner{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--yellow),#ffe9a3);display:grid;place-items:center;font-weight:1000;box-shadow:0 10px 20px rgba(255,212,90,.35)}
    .brand b{display:block;font-size:20px;line-height:1}.brand span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:700}
    .btn{border:0;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:1000;cursor:pointer;white-space:nowrap}.btn:active{transform:translateY(1px)}
    .btn-yellow{background:linear-gradient(180deg,var(--yellow),#ffe08a);color:#111827;box-shadow:0 8px 18px rgba(255,212,90,.28)}
    .btn-dark{background:var(--dark);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-orange{background:var(--orange);color:#111827}.btn-light{background:#fff;border:1px solid var(--line);color:#334155}
    .wrap{max-width:1280px;margin:0 auto;padding:12px 16px 24px}
    .hero{background:linear-gradient(135deg,#101827,#172033);border-radius:20px;padding:14px 16px;color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
    .hero small{display:block;color:#ffd45a;font-weight:1000;font-size:11px}.hero h1{font-size:20px;margin:3px 0 2px}.hero p{margin:0;color:#cbd5e1;font-size:12px;font-weight:700}.pill-live{background:#dcfce7;color:#166534;border-radius:999px;padding:7px 10px;font-weight:1000;font-size:12px;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 5px 16px rgba(16,24,39,.035)}.stat small{display:block;color:#8a4b00;font-weight:1000;font-size:10px}.stat b{display:block;font-size:22px;margin-top:2px;letter-spacing:-.5px}
    .filters{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 6px 18px rgba(16,24,39,.04);display:grid;grid-template-columns:1.7fr .8fr .8fr auto;gap:10px;align-items:end;margin-bottom:10px}
    label{display:block;font-size:10px;color:#475467;font-weight:1000;margin:0 0 5px}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 11px;font-size:13px;outline:none;height:40px}input:focus,select:focus{border-color:#f4c430;box-shadow:0 0 0 3px rgba(255,212,90,.20)}
    .quick{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}.chip{border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;padding:8px 12px;font-weight:1000;cursor:pointer;font-size:13px}.chip.active{background:#101827;color:#fff;border-color:#101827}
    .msg{font-size:12px;font-weight:900;margin:0 0 8px;color:#166534}.msg.err{color:#b91c1c}
    .table-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.thead,.row{display:grid;grid-template-columns:minmax(150px,1.25fr) 150px 74px 64px 112px 96px 105px 82px 252px;gap:7px;align-items:center}.thead{position:static;background:#fbfaf6;border-bottom:1px solid var(--line);padding:8px 10px;color:#667085;font-size:10px;font-weight:1000;text-transform:uppercase}.row{min-height:54px;padding:7px 10px;border-bottom:1px solid #f0ede6}.row:last-child{border-bottom:0}.row:hover{background:#fffdf5}.name b{display:block;font-size:13px;line-height:1.12}.name span,.subtxt{display:block;color:var(--muted);font-size:10px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:1000;font-size:13px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:1000;border:1px solid rgba(0,0,0,.07);white-space:nowrap;line-height:1.05}.dot{width:6px;height:6px;border-radius:999px;flex:0 0 auto}.b-yellow{background:#fff7d6;color:#92400e}.b-yellow .dot{background:#f59e0b}.b-green{background:#dcfce7;color:#166534}.b-green .dot{background:#16a34a}.b-red{background:#fee2e2;color:#991b1b}.b-red .dot{background:#dc2626}.b-orange{background:#ffedd5;color:#9a3412}.b-orange .dot{background:#ea580c}.b-blue{background:#dbeafe;color:#1e40af}.b-blue .dot{background:#2563eb}.b-gray{background:#f1f5f9;color:#475569}.b-gray .dot{background:#64748b}.actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap;width:100%;min-width:0}.actions .btn{padding:6px 7px;border-radius:9px;font-size:10.5px;line-height:1;min-width:auto;flex:0 0 auto}.actions .btn-light:last-child{max-width:68px;overflow:hidden;text-overflow:ellipsis}.openlink{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.note{grid-column:1/-1;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:7px 10px;color:#9a3412;font-weight:900;font-size:11px}.empty{padding:28px;text-align:center;color:var(--muted);font-weight:1000}

    .groupbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 10px;margin:0 0 10px;box-shadow:0 6px 18px rgba(16,24,39,.04)}
    .groupbar-left{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.groupbar small{color:var(--muted);font-weight:900}.toggle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:1000;color:#334155}.toggle input{width:auto;height:auto}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.show{display:flex}.modal-card{width:min(920px,96vw);height:min(88vh,760px);background:#fff;border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-title{font-weight:1000}.modal-body{flex:1;background:#f8fafc;display:grid;place-items:center;overflow:hidden}.modal-body iframe,.modal-body img{width:100%;height:100%;border:0;object-fit:contain;background:#fff}.modal-actions{display:flex;gap:8px;flex-wrap:wrap}.tiny{padding:8px 10px!important;font-size:12px!important;border-radius:11px!important}

    @media(max-width:980px){.thead{display:none}.table-card{background:transparent;border:0;box-shadow:none;display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(16,24,39,.05)}.row>div:before{content:attr(data-label);display:block;font-size:10px;color:#94a3b8;font-weight:1000;margin-bottom:4px}.name:before,.actions:before{display:none!important}.actions{grid-column:1/-1;justify-content:flex-start}.actions .btn,.openlink{flex:1}.note{grid-column:1/-1}}
    @media(max-width:760px){.topbar-inner{padding:12px}.brand b{font-size:16px}.logo{width:38px;height:38px}.wrap{padding:12px}.hero{border-radius:20px;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr}.actions .btn,.openlink{width:100%}}
  .slipImg{display:block;max-width:100%;max-height:72vh;margin:0 auto;object-fit:contain}.slipHint{padding:8px 12px;background:#fff7dc;border-bottom:1px solid #f2dfaa;font-size:12px;font-weight:800;color:#92400e}
</style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">LP</div><div><b>Staff Dashboard v7</b><span>ตรวจสลิป / ปุ่มไม่ซ้อน / ดูสลิป popup / auto refresh</span></div></div><button class="btn btn-yellow" onclick="loadData()">รีเฟรช</button></div></div>
  <div class="wrap">
    <section class="hero"><div><small>ACTIVE EVENT</small><h1 id="eventName">กำลังโหลด...</h1><p id="eventSub">ระบบจะดึงรายการล่าสุดจาก Google Sheet</p></div><div class="pill-live">● พร้อมใช้งาน</div></section>
    <section class="stats" id="summary"></section>
    <section class="filters"><div><label>ค้นหา</label><input id="q" placeholder="ชื่อ / เบอร์ / Facebook / Line / group_ref" oninput="render()"></div><div><label>สถานะอนุมัติ</label><select id="statusFilter" onchange="render()"><option value="">ทั้งหมด</option><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่ผ่าน</option></select></div><div><label>สถานะสลิป</label><select id="slipFilter" onchange="render()"><option value="">ทั้งหมด</option><option value="PASS_BASIC">ผ่านเบื้องต้น</option><option value="WAITING_CHECK">รอตรวจ</option><option value="AMOUNT_MISMATCH">ยอดไม่ตรง</option><option value="ACCOUNT_MISMATCH">บัญชีไม่ตรง</option><option value="AMOUNT_AND_ACCOUNT_MISMATCH">ยอด+บัญชีไม่ตรง</option><option value="SLIP_READ_FAILED">อ่านสลิปไม่ได้</option><option value="GEMINI_RATE_LIMIT">รอคิว Gemini</option><option value="FILE_ERROR">ไฟล์มีปัญหา</option><option value="NEED_RESUBMIT">ขอส่งใหม่</option><option value="REJECTED">ไม่ผ่าน</option></select></div><button class="btn btn-light" onclick="clearFilters()">ล้างตัวกรอง</button></section>
    <div class="quick"><button class="chip active" data-slip="" onclick="quickSlip(this,'')">ทั้งหมด</button><button class="chip" data-slip="WAITING_CHECK" onclick="quickSlip(this,'WAITING_CHECK')">รอตรวจสลิป</button><button class="chip" data-slip="PASS_BASIC" onclick="quickSlip(this,'PASS_BASIC')">ผ่านเบื้องต้น</button><button class="chip" data-slip="AMOUNT_MISMATCH" onclick="quickSlip(this,'AMOUNT_MISMATCH')">ยอดไม่ตรง</button><button class="chip" data-slip="ACCOUNT_MISMATCH" onclick="quickSlip(this,'ACCOUNT_MISMATCH')">บัญชีไม่ตรง</button><button class="chip" data-slip="SLIP_READ_FAILED" onclick="quickSlip(this,'SLIP_READ_FAILED')">อ่านไม่ได้</button><button class="chip" data-slip="GEMINI_RATE_LIMIT" onclick="quickSlip(this,'GEMINI_RATE_LIMIT')">รอคิว Gemini</button><button class="chip" data-slip="FILE_ERROR" onclick="quickSlip(this,'FILE_ERROR')">ไฟล์มีปัญหา</button></div>
    <div class="groupbar"><div class="groupbar-left"><button class="btn btn-dark tiny" onclick="approveVisibleGroups()">อนุมัติทั้งกลุ่มที่เห็น</button><button class="btn btn-light tiny" onclick="showOnlyProblem()">ดูเฉพาะสลิปมีปัญหา</button><button class="btn btn-orange tiny" id="btnQueue" onclick="recheckPendingQueue()">ตรวจสลิปที่รอตรวจ</button><small id="autoInfo">Auto refresh: เปิด</small></div><label class="toggle"><input id="autoRefresh" type="checkbox" checked onchange="toggleAuto()"> รีเฟรชอัตโนมัติ</label></div>
    <p id="msg" class="msg"></p>
    <section class="table-card" id="table"><div class="empty">กำลังโหลดข้อมูล...</div></section>
  </div>
<div class="modal" id="slipModal" onclick="modalBackdrop(event)"><div class="modal-card"><div class="modal-head"><div class="modal-title" id="modalTitle">ดูสลิป</div><div class="modal-actions"><a id="openNewTab" class="btn btn-light tiny" target="_blank">เปิดแท็บใหม่</a><button class="btn btn-dark tiny" onclick="closeSlipModal()">ปิด</button></div></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";
  var STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";
  var DATA = [];
  var AUTO_TIMER = null;
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(n){n=Number(String(n||0).replace(/[^0-9.]/g,''))||0;return '฿'+n.toLocaleString('th-TH')}
  async function api(params){var url=WEB_APP_URL+'?'+new URLSearchParams(Object.assign({t:Date.now()},params)).toString();var r=await fetch(url);var txt=await r.text();try{return JSON.parse(txt)}catch(e){throw new Error(txt.slice(0,160))}}
  function slipBadge(st){st=String(st||'WAITING_CHECK').toUpperCase(); if(st==='PASS_BASIC')return '<span class="badge b-green"><span class="dot"></span>ยอด+บัญชีตรง</span>'; if(st==='AMOUNT_MISMATCH')return '<span class="badge b-red"><span class="dot"></span>ยอดไม่ตรง</span>'; if(st==='ACCOUNT_MISMATCH')return '<span class="badge b-red"><span class="dot"></span>บัญชีไม่ตรง</span>'; if(st==='AMOUNT_AND_ACCOUNT_MISMATCH')return '<span class="badge b-red"><span class="dot"></span>ยอด+บัญชีผิด</span>'; if(st==='GEMINI_RATE_LIMIT')return '<span class="badge b-orange"><span class="dot"></span>รอคิว Gemini</span>'; if(st==='SLIP_READ_FAILED')return '<span class="badge b-orange"><span class="dot"></span>อ่านสลิปไม่ได้</span>'; if(st==='WAITING_GEMINI_CHECK')return '<span class="badge b-yellow"><span class="dot"></span>กำลังตรวจ</span>'; if(st==='FILE_ERROR')return '<span class="badge b-red"><span class="dot"></span>ไฟล์มีปัญหา</span>'; if(st==='NEED_RESUBMIT')return '<span class="badge b-orange"><span class="dot"></span>ขอส่งใหม่</span>'; if(st==='APPROVED')return '<span class="badge b-blue"><span class="dot"></span>สลิปอนุมัติ</span>'; if(st==='REJECTED')return '<span class="badge b-red"><span class="dot"></span>สลิปไม่ผ่าน</span>'; return '<span class="badge b-yellow"><span class="dot"></span>รอตรวจสลิป</span>'}
  function approveBadge(st){st=String(st||'pending').toLowerCase(); if(st==='approved')return '<span class="badge b-green"><span class="dot"></span>อนุมัติ</span>'; if(st==='rejected')return '<span class="badge b-red"><span class="dot"></span>ไม่ผ่าน</span>'; return '<span class="badge b-yellow"><span class="dot"></span>รออนุมัติ</span>'}
  function checkBadge(st){st=String(st||'').toUpperCase(); return st==='CHECKED_IN'?'<span class="badge b-blue"><span class="dot"></span>เช็กอินแล้ว</span>':'<span class="badge b-gray"><span class="dot"></span>ยังไม่เช็กอิน</span>'}
  function giftBadge(st){st=String(st||'').toUpperCase(); return st==='RECEIVED'?'<span class="badge b-green"><span class="dot"></span>รับแล้ว</span>':'<span class="badge b-gray"><span class="dot"></span>ยังไม่รับ</span>'}
  async function loadData(){el('msg').className='msg';el('msg').textContent='กำลังโหลดข้อมูล...';try{var ev=await api({action:'event_get_active',staff_token:STAFF_TOKEN}); if(ev&&ev.ok&&ev.event){el('eventName').textContent=ev.event.event_name||ev.event.event_id||'Active Event';el('eventSub').textContent=(ev.event.event_date||'')+' · '+(ev.event.event_id||'')}var res=await api({action:'staff_dashboard_list',staff_token:STAFF_TOKEN}); if(!res.ok)throw new Error(res.message||'โหลดไม่สำเร็จ'); DATA=res.items||[]; renderSummary(res.summary||{}); el('msg').className='msg'; el('msg').textContent='โหลดข้อมูลแล้ว '+DATA.length+' รายการ'; render()}catch(e){el('msg').className='msg err';el('msg').textContent='โหลดไม่ได้: '+e.message; el('table').innerHTML='<div class="empty">โหลดข้อมูลไม่ได้</div>'}}
  function renderSummary(s){var keys=['total','pending','approved','rejected','checked_in','slip_problem'];var labels=['ทั้งหมด','รอตรวจ','อนุมัติ','ไม่ผ่าน','เช็กอิน','สลิปมีปัญหา'];el('summary').innerHTML=keys.map(function(k,i){return '<div class="stat"><small>'+labels[i]+'</small><b>'+(s[k]||0)+'</b></div>'}).join('')}
  function getFiltered(){var q=el('q').value.trim().toLowerCase();var sf=el('statusFilter').value;var sl=el('slipFilter').value;return DATA.filter(function(x){var hay=[x.final_name,x.phone,x.facebook,x.lineId,x.group_ref,x.group_leader_phone,x.claim_code].join(' ').toLowerCase(); if(q&&hay.indexOf(q)===-1)return false; if(sf&&String(x.reg_status||'').toLowerCase()!==sf)return false; if(sl&&String(x.slip_check_status||'WAITING_CHECK').toUpperCase()!==sl)return false; return true})}
  function render(){var arr=getFiltered(); if(!arr.length){el('table').innerHTML='<div class="empty">ไม่พบรายการตามตัวกรอง</div>';return} el('table').innerHTML='<div class="thead"><div>รายชื่อ</div><div>เบอร์ / กลุ่ม</div><div>ยอด</div><div>ไซส์</div><div>สลิป</div><div>อนุมัติ</div><div>เช็กอิน</div><div>รับเสื้อ</div><div>จัดการ</div></div>'+arr.map(rowHtml).join('')}
  function rowHtml(x){
    var slipUrl=x.preview_url||x.file_url||'';
    var amount=x.deposit||x.payment_total||0;
    var group=x.group_size&&Number(x.group_size)>1?x.group_size+' คน · '+(x.group_ref||'-'):(x.group_ref||'เดี่ยว');
    var gem=[]; if(x.slip_amount_found)gem.push('ยอดที่อ่านได้: ฿'+Number(String(x.slip_amount_found).replace(/[^0-9.]/g,'')).toLocaleString('th-TH')); if(x.slip_receiver_account)gem.push('บัญชี: '+esc(x.slip_receiver_account)); if(x.slip_receiver_name)gem.push('ชื่อบัญชี: '+esc(x.slip_receiver_name)); if(x.slip_reference_no)gem.push('Ref: '+esc(x.slip_reference_no)); var note=(x.slip_check_note||gem.length)?'<div class="note">'+(x.slip_check_note?'หมายเหตุสลิป: '+esc(x.slip_check_note):'')+(gem.length?'<br>'+gem.join(' • '):'')+'</div>':'';
    var groupBtn=(x.group_ref&&Number(x.group_size||1)>1)?'<button class="btn btn-light" onclick="approveGroup(\''+esc(x.group_ref)+'\')">อนุมัติกลุ่ม</button>':'';
    return '<div class="row">'
      +'<div class="name"><b>'+esc(x.final_name||'-')+'</b><span>'+esc(x.facebook||'-')+' · Line: '+esc(x.lineId||'-')+'</span></div>'
      +'<div data-label="เบอร์ / กลุ่ม"><b>'+esc(x.phone||'-')+'</b><span class="subtxt">'+esc(group)+'</span></div>'
      +'<div data-label="ยอด" class="amount">'+money(amount)+'</div>'
      +'<div data-label="ไซส์"><b>'+esc(x.shirt_size||'-')+'</b><span class="subtxt">แถว '+esc(x.row||'-')+'</span></div>'
      +'<div data-label="สลิป">'+slipBadge(x.slip_check_status)+'</div>'
      +'<div data-label="อนุมัติ">'+approveBadge(x.reg_status)+'</div>'
      +'<div data-label="เช็กอิน">'+checkBadge(x.checkin_status)+'</div>'
      +'<div data-label="รับเสื้อ">'+giftBadge(x.gift_status)+'</div>'
      +'<div class="actions">'
      +(slipUrl?'<button class="btn btn-dark" onclick="openSlipModal(\''+esc(slipUrl)+'\',\''+esc(x.final_name||'ดูสลิป')+'\')">ดูสลิป</button>':'<button class="btn btn-light" disabled>ไม่มีสลิป</button>')+'<button class="btn btn-light" onclick="recheckSlip('+x.row+')">ตรวจใหม่</button>'
      +'<button class="btn btn-green" onclick="updateStatus('+x.row+',\'approved\')">อนุมัติ</button>'
      +'<button class="btn btn-red" onclick="updateStatus('+x.row+',\'rejected\')">ไม่ผ่าน</button>'
            +groupBtn
      +'</div>'+note+'</div>'
  }


  function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  function isPendingSlipStatus(st){
    st=String(st||'').toUpperCase();
    return !st || ['WAITING_CHECK','WAITING_GEMINI_CHECK','SLIP_READ_FAILED','GEMINI_RATE_LIMIT','FILE_ERROR','WAITING_MANUAL_CHECK'].indexOf(st)>-1;
  }

  async function recheckSlip(row, opts){
    opts=opts||{};
    if(!row){ el('msg').className='msg err'; el('msg').textContent='ไม่พบแถวข้อมูลสำหรับตรวจสลิป'; return null; }
    try{
      el('msg').className='msg';
      el('msg').textContent=opts.silent?'กำลังตรวจคิวสลิป...':'กำลังให้ Gemini ตรวจสลิปใหม่...';
      var res=await api({action:'staff_recheck_slip',staff_token:STAFF_TOKEN,row:row,force:opts.force?'TRUE':'',t:Date.now()});
      if(!res.ok) throw new Error(res.message||res.note||'ตรวจสลิปใหม่ไม่สำเร็จ');
      if(!opts.silent){
        el('msg').className='msg ok';
        el('msg').textContent=(res.cached?'ใช้ผลเดิม: ':'ตรวจสลิปใหม่แล้ว: ')+(res.status||'-')+(res.note?' — '+res.note:'');
        await loadData();
      }
      return res;
    }catch(e){
      if(!opts.silent){
        el('msg').className='msg err';
        el('msg').textContent='ตรวจสลิปใหม่ไม่ได้: '+e.message;
      }
      return {ok:false,message:e.message};
    }
  }

  async function recheckPendingQueue(){
    var btn=el('btnQueue');
    var candidates=DATA.filter(function(x){return isPendingSlipStatus(x.slip_check_status)});
    var seen={};
    candidates=candidates.filter(function(x){
      var key=String(x.group_ref||'') || ('ROW-'+x.row);
      if(seen[key]) return false;
      seen[key]=true;
      return true;
    });
    if(!candidates.length){
      el('msg').className='msg ok';
      el('msg').textContent='ไม่มีรายการรอตรวจสลิปแล้ว';
      return;
    }
    if(!confirm('ตรวจสลิปที่รอตรวจ '+candidates.length+' รายการ/กลุ่ม? ระบบจะตรวจทีละรายการเพื่อกัน Gemini 429')) return;
    var oldText=btn.textContent;
    btn.disabled=true;
    btn.textContent='กำลังตรวจ...';
    var ok=0, fail=0, rate=0;
    try{
      if(el('autoRefresh').checked){el('autoRefresh').checked=false;toggleAuto();}
      for(var i=0;i<candidates.length;i++){
        var item=candidates[i];
        el('msg').className='msg';
        el('msg').textContent='กำลังตรวจสลิป '+(i+1)+'/'+candidates.length+' : '+(item.final_name||item.phone||item.group_ref||item.row);
        var res=await recheckSlip(item.row,{silent:true});
        if(res&&res.ok){ok++; if(String(res.status||'').toUpperCase()==='GEMINI_RATE_LIMIT') rate++;}
        else fail++;
        await sleep(3500);
      }
      el('msg').className=rate?'msg err':'msg ok';
      el('msg').textContent='ตรวจคิวเสร็จ: สำเร็จ '+ok+' / ไม่สำเร็จ '+fail+(rate?' / ติด rate limit '+rate+' รายการ ให้รอแล้วกดต่อ':'');
      await loadData();
    }finally{
      btn.disabled=false;
      btn.textContent=oldText;
    }
  }

  async function updateStatus(row,status){var note=''; if(status==='rejected') note=prompt('ใส่หมายเหตุไม่ผ่าน (เว้นว่างได้)','')||''; try{el('msg').className='msg';el('msg').textContent='กำลังอัปเดต...';var res=await api({action:'staff_update_status',staff_token:STAFF_TOKEN,row:row,status:status,note:note}); if(!res.ok)throw new Error(res.message||'อัปเดตไม่สำเร็จ'); await loadData()}catch(e){el('msg').className='msg err';el('msg').textContent=e.message}}
  function clearFilters(){el('q').value='';el('statusFilter').value='';el('slipFilter').value='';document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('active',c.dataset.slip==='')});render()}
  function quickSlip(btn,val){el('slipFilter').value=val;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});btn.classList.add('active');render()}

  function getDriveFileId(url){
    url=String(url||'');
    var m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if(m&&m[1]) return m[1];
    m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if(m&&m[1]) return m[1];
    return '';
  }

  function drivePreviewUrl(url){
    var id=getDriveFileId(url);
    if(!id) return url;
    return 'https://drive.google.com/file/d/'+id+'/preview';
  }

  function driveThumbUrl(url){
    var id=getDriveFileId(url);
    if(!id) return url;
    return 'https://drive.google.com/thumbnail?id='+id+'&sz=w1600';
  }

  function openSlipModal(url,title){
    url=String(url||'');
    el('modalTitle').textContent='สลิป: '+(title||'');
    el('openNewTab').href=url;

    var id=getDriveFileId(url);
    var isPdf=/\.pdf(\?|$)/i.test(url);
    var isDrive=!!id || url.indexOf('drive.google.com')>-1;
    var html='';

    if(isDrive && !isPdf){
      html='<div class="slipHint">ถ้ารูปไม่ขึ้น ให้กดปุ่ม “เปิดแท็บใหม่” ด้านบน</div>'
        +'<img class="slipImg" src="'+esc(driveThumbUrl(url))+'" alt="slip" loading="lazy" onerror="this.style.display=\'none\';document.getElementById(\'drivePreviewFallback\').style.display=\'block\';">'
        +'<div id="drivePreviewFallback" style="display:none;height:70vh"><iframe src="'+esc(drivePreviewUrl(url))+'" loading="lazy"></iframe></div>';
    } else if(isDrive){
      html='<iframe src="'+esc(drivePreviewUrl(url))+'" loading="lazy"></iframe>';
    } else {
      html='<iframe src="'+esc(url)+'" loading="lazy"></iframe>';
    }

    el('modalBody').innerHTML=html;
    el('slipModal').classList.add('show');
  }
  function closeSlipModal(){el('slipModal').classList.remove('show');el('modalBody').innerHTML=''}
  function modalBackdrop(e){if(e.target&&e.target.id==='slipModal')closeSlipModal()}
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSlipModal()});

  async function approveGroup(groupRef){
    var rows=DATA.filter(function(x){return String(x.group_ref||'')===String(groupRef||'')}).map(function(x){return x.row});
    if(!rows.length)return;
    if(!confirm('อนุมัติทั้งกลุ่ม '+groupRef+' จำนวน '+rows.length+' รายการ?'))return;
    el('msg').className='msg'; el('msg').textContent='กำลังอนุมัติทั้งกลุ่ม...';
    try{
      for(var i=0;i<rows.length;i++){
        var res=await api({action:'staff_update_status',staff_token:STAFF_TOKEN,row:rows[i],status:'approved',note:'approved by group'});
        if(!res.ok) throw new Error(res.message||('อัปเดตแถว '+rows[i]+' ไม่สำเร็จ'));
      }
      await loadData();
    }catch(e){el('msg').className='msg err';el('msg').textContent=e.message}
  }
  async function approveVisibleGroups(){
    var arr=getFiltered();
    var groups={};
    arr.forEach(function(x){ if(x.group_ref && Number(x.group_size||1)>1) groups[x.group_ref]=true; });
    var refs=Object.keys(groups);
    if(!refs.length){el('msg').textContent='ไม่มีรายการกลุ่มในหน้าที่เห็น';return}
    if(!confirm('อนุมัติกลุ่มที่เห็นทั้งหมด '+refs.length+' กลุ่ม?'))return;
    for(var i=0;i<refs.length;i++){ await approveGroup(refs[i]); }
  }
  function showOnlyProblem(){
    el('statusFilter').value='';
    el('slipFilter').value='AMOUNT_MISMATCH';
    document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});
    render();
  }
  function toggleAuto(){
    if(AUTO_TIMER){clearInterval(AUTO_TIMER);AUTO_TIMER=null;}
    if(el('autoRefresh').checked){AUTO_TIMER=setInterval(loadData,30000);el('autoInfo').textContent='Auto refresh: เปิด';}
    else{el('autoInfo').textContent='Auto refresh: ปิด';}
  }
  toggleAuto();

  loadData();
</script>
</body>
