<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Dashboard หน้างาน</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 16px 24px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }

    .sub {
      color: #6b7280;
      font-size: 14px;
      margin-top: 6px;
    }

    .refreshBtn {
      border: 0;
      background: #111827;
      color: #fff;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(17,24,39,.12);
    }

    .refreshBtn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metricCard {
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.05);
      border: 1px solid rgba(255,255,255,.65);
    }

    .metricLabel {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      opacity: .85;
    }

    .metricValue {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }

    .card-total {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: #111827;
    }

    .card-checked {
      background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
      color: #065f46;
    }

    .card-remaining {
      background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%);
      color: #9a3412;
    }

    .card-vip-total {
      background: linear-gradient(180deg, #faf5ff 0%, #f3e8ff 100%);
      color: #6b21a8;
    }

    .card-vip-checked {
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      color: #1d4ed8;
    }

    .card-refunded {
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      color: #166534;
    }

    .card-gift {
      background: linear-gradient(180deg, #fdf4ff 0%, #fae8ff 100%);
      color: #86198f;
    }

    .card-pending {
      background: linear-gradient(180deg, #fff7ed 0%, #fed7aa 100%);
      color: #9a3412;
    }

    .panel {
      background: #fff;
      border-radius: 20px;
      padding: 18px 16px 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,.05);
    }

    .panelTitle {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .latestList {
      display: grid;
      gap: 12px;
    }

    .latestItem {
      border: 1px solid #ececec;
      border-radius: 16px;
      padding: 14px;
      background: #fff;
    }

    .latestName {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      color: #111827;
    }

    .latestMeta {
      margin-top: 8px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.65;
    }

    .badgeRow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .vip {
      background: #fff4c2;
      color: #6b4f00;
    }

    .ok {
      background: #e8f5e9;
      color: #137333;
    }

    .wait {
      background: #f3f4f6;
      color: #374151;
    }

    .empty {
      color: #6b7280;
      font-size: 15px;
      text-align: center;
      padding: 28px 10px;
    }

    .footerNote {
      margin-top: 14px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .wrap {
        padding: 14px 12px 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 24px;
      }

      .metricValue {
        font-size: 34px;
      }

      .panelTitle {
        font-size: 18px;
      }

      .latestName {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title">Dashboard หน้างาน</div>
        <div class="sub">สรุปเช็กอิน / คืนเงิน / รับของ แบบเรียลไทม์</div>
      </div>
      <button class="refreshBtn" id="refreshBtn">รีเฟรชข้อมูล</button>
    </div>

    <div class="grid">
      <div class="metricCard card-total">
        <div class="metricLabel">ลงทะเบียนทั้งหมด</div>
        <div class="metricValue" id="totalRegistered">0</div>
      </div>

      <div class="metricCard card-checked">
        <div class="metricLabel">เช็กอินแล้ว</div>
        <div class="metricValue" id="checkedIn">0</div>
      </div>

      <div class="metricCard card-remaining">
        <div class="metricLabel">ยังไม่เช็กอิน</div>
        <div class="metricValue" id="remaining">0</div>
      </div>

      <div class="metricCard card-vip-total">
        <div class="metricLabel">VIP ทั้งหมด</div>
        <div class="metricValue" id="vipTotal">0</div>
      </div>

      <div class="metricCard card-vip-checked">
        <div class="metricLabel">VIP เช็กอินแล้ว</div>
        <div class="metricValue" id="vipCheckedIn">0</div>
      </div>

      <div class="metricCard card-refunded">
        <div class="metricLabel">คืนเงินแล้ว</div>
        <div class="metricValue" id="refundedCount">0</div>
      </div>

      <div class="metricCard card-gift">
        <div class="metricLabel">รับของแล้ว</div>
        <div class="metricValue" id="giftReceivedCount">0</div>
      </div>

      <div class="metricCard card-pending">
        <div class="metricLabel">ค้างขั้นตอน</div>
        <div class="metricValue" id="redemptionPendingCount">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panelTitle">รายการเช็กอินล่าสุด</div>
      <div id="latestList" class="latestList"></div>
    </div>

    <div class="footerNote" id="lastUpdated">กำลังโหลดข้อมูล...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";

    const totalRegisteredEl = document.getElementById("totalRegistered");
    const checkedInEl = document.getElementById("checkedIn");
    const remainingEl = document.getElementById("remaining");
    const vipTotalEl = document.getElementById("vipTotal");
    const vipCheckedInEl = document.getElementById("vipCheckedIn");
    const refundedCountEl = document.getElementById("refundedCount");
    const giftReceivedCountEl = document.getElementById("giftReceivedCount");
    const redemptionPendingCountEl = document.getElementById("redemptionPendingCount");
    const latestListEl = document.getElementById("latestList");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const refreshBtn = document.getElementById("refreshBtn");

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderLatest(items) {
      if (!items || !items.length) {
        latestListEl.innerHTML = `<div class="empty">ยังไม่มีข้อมูลการเช็กอิน</div>`;
        return;
      }

      latestListEl.innerHTML = items.map(item => `
        <div class="latestItem">
          <div class="latestName">${escapeHtml(item.name || "-")}</div>
          <div class="latestMeta">
            เบอร์: ${escapeHtml(item.phone || "-")}<br>
            เวลาเช็กอิน: ${escapeHtml(item.checkin_time || "-")}<br>
            โดย: ${escapeHtml(item.checked_by || "-")}
          </div>

          <div class="badgeRow">
            ${item.tag === "VIP" ? `<span class="badge vip">VIP</span>` : ``}
            <span class="badge ${item.refund_status === "REFUNDED" ? "ok" : "wait"}">
              ${item.refund_status === "REFUNDED" ? "คืนเงินแล้ว" : "ยังไม่คืนเงิน"}
            </span>
            <span class="badge ${item.gift_status === "RECEIVED" ? "ok" : "wait"}">
              ${item.gift_status === "RECEIVED" ? "รับของแล้ว" : "ยังไม่รับของ"}
            </span>
          </div>
        </div>
      `).join("");
    }

    async function loadDashboard() {
      try {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "กำลังโหลด...";

        const res = await fetch(`${API_URL}?action=dashboard_summary`);
        const data = await res.json();

        if (!data.ok) {
          latestListEl.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>`;
          lastUpdatedEl.textContent = "โหลดข้อมูลไม่สำเร็จ";
          return;
        }

        totalRegisteredEl.textContent = data.summary.total_registered || 0;
        checkedInEl.textContent = data.summary.checked_in || 0;
        remainingEl.textContent = data.summary.remaining || 0;
        vipTotalEl.textContent = data.summary.vip_total || 0;
        vipCheckedInEl.textContent = data.summary.vip_checked_in || 0;
        refundedCountEl.textContent = data.summary.refunded_count || 0;
        giftReceivedCountEl.textContent = data.summary.gift_received_count || 0;
        redemptionPendingCountEl.textContent = data.summary.redemption_pending_count || 0;

        renderLatest(data.latest_checkins || []);
        lastUpdatedEl.textContent = "อัปเดตล่าสุด: " + new Date().toLocaleString("th-TH");
      } catch (err) {
        latestListEl.innerHTML = `<div class="empty">เชื่อมต่อระบบไม่สำเร็จ</div>`;
        lastUpdatedEl.textContent = "เชื่อมต่อระบบไม่สำเร็จ";
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "รีเฟรชข้อมูล";
      }
    }

    refreshBtn.addEventListener("click", loadDashboard);

    loadDashboard();
    setInterval(loadDashboard, 15000);
  </script>
</body>
</html>
