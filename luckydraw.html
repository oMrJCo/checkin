<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw</title>

<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: #fff;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

#winnerBox {
  font-size: 28px;
  font-weight: bold;
  margin: 30px 0;
  padding: 20px;
  background: #1e293b;
  border-radius: 12px;
}

button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#drawBtn { background: #facc15; color: #000; }
#confirmBtn { background: #22c55e; color: #000; }
#skipBtn { background: #ef4444; color: #fff; }

#warning {
  color: #f87171;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🎉 Lucky Draw</h1>

<div id="winnerBox">กดสุ่มเพื่อเริ่ม</div>

<button id="drawBtn">สุ่ม</button>
<button id="confirmBtn" disabled>ยืนยันผู้ชนะ</button>
<button id="skipBtn" disabled>ผู้รับไม่อยู่ / สุ่มใหม่</button>

<div id="warning"></div>

<script>
const WEB_APP_URL = "ใส่ URL Apps Script";

let allParticipants = [];
let winners = [];
let pendingWinner = null;

// โหลดรายชื่อจากระบบ
async function loadParticipants() {
  const res = await fetch(WEB_APP_URL + "?action=getParticipants");
  const data = await res.json();
  allParticipants = data;
}

function showWarning(msg) {
  document.getElementById("warning").innerText = msg;
}

// สุ่ม
document.getElementById("drawBtn").onclick = () => {

  // ถ้ายังไม่ยืนยัน ห้ามสุ่มใหม่
  if (pendingWinner) {
    showWarning("⚠️ กรุณายืนยันผล หรือกดสุ่มใหม่ก่อน");
    return;
  }

  showWarning("");

  const remaining = allParticipants.filter(p => !winners.includes(p.phone));

  if (remaining.length === 0) {
    document.getElementById("winnerBox").innerText = "ไม่มีรายชื่อเหลือแล้ว";
    return;
  }

  const random = remaining[Math.floor(Math.random() * remaining.length)];

  pendingWinner = random;

  document.getElementById("winnerBox").innerText =
    random.fullname + " (" + random.phone + ")";

  document.getElementById("confirmBtn").disabled = false;
  document.getElementById("skipBtn").disabled = false;
};

// ยืนยันผู้ชนะ
document.getElementById("confirmBtn").onclick = async () => {

  if (!pendingWinner) return;

  await fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "confirmWinner",
      phone: pendingWinner.phone
    })
  });

  winners.push(pendingWinner.phone);

  pendingWinner = null;

  document.getElementById("winnerBox").innerText = "✅ บันทึกผู้ชนะแล้ว";
  document.getElementById("confirmBtn").disabled = true;
  document.getElementById("skipBtn").disabled = true;
};

// สุ่มใหม่ (ผู้รับไม่อยู่)
document.getElementById("skipBtn").onclick = () => {
  pendingWinner = null;

  document.getElementById("winnerBox").innerText = "❌ ข้ามผู้โชคดีคนนี้";
  document.getElementById("confirmBtn").disabled = true;
  document.getElementById("skipBtn").disabled = true;

  showWarning("");
};

// init
loadParticipants();
</script>

</body>
</html>
