<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Lucky Draw</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.18), transparent 30%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 14px 40px;
      min-height: 100vh;
    }

    .card {
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.28);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
    }

    .sub {
      color: rgba(255,255,255,.78);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
      text-align: center;
    }

    input, button {
      width: 100%;
      border-radius: 16px;
      font-size: 18px;
    }

    input {
      min-height: 54px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: #fff;
      padding: 0 16px;
      margin-bottom: 12px;
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,.55);
    }

    input:focus {
      border-color: rgba(250,204,21,.7);
      box-shadow: 0 0 0 4px rgba(250,204,21,.12);
    }

    button {
      min-height: 54px;
      border: 0;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .drawBtn {
      background: linear-gradient(180deg, #facc15 0%, #f59e0b 100%);
      color: #111827;
      box-shadow: 0 10px 30px rgba(245,158,11,.28);
    }

    .confirmBtn {
      background: linear-gradient(180deg, #8b5cf6 0%, #7c3aed 100%);
      color: #fff;
      margin-top: 18px;
      display: none;
    }

    .confirmBtn.show {
      display: block;
      animation: fadeUp .35s ease;
    }

    .msg {
      margin-top: 14px;
      min-height: 24px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .err { color: #fca5a5; }
    .ok { color: #86efac; }

    .winnerStage {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 18px 10px 8px;
      border-radius: 24px;
      background:
        radial-gradient(circle at center, rgba(250,204,21,.14), transparent 45%),
        rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .glowRing {
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle, rgba(250,204,21,.20), transparent 45%);
      opacity: 0;
      pointer-events: none;
    }

    .glowRing.active {
      animation: pulseGlow 1.2s ease-in-out infinite;
      opacity: 1;
    }

    .winnerLabel {
      position: relative;
      font-size: 14px;
      color: rgba(255,255,255,.75);
      z-index: 2;
    }

    .rollingBox {
      position: relative;
      margin-top: 18px;
      min-height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .winnerName {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.18;
      color: #fff;
      word-break: break-word;
      text-shadow: 0 6px 20px rgba(0,0,0,.35);
      transition: transform .25s ease, opacity .25s ease;
    }

    .winnerName.rolling {
      animation: jitter .12s linear infinite;
      opacity: .95;
    }

    .winnerName.reveal {
      animation: winnerPop .7s cubic-bezier(.2,.8,.2,1);
      color: #fde68a;
    }

    .winnerMeta {
      position: relative;
      margin-top: 12px;
      font-size: 18px;
      color: rgba(255,255,255,.84);
      line-height: 1.7;
      z-index: 2;
    }

    .codeBox {
      position: relative;
      margin-top: 20px;
      background: rgba(0,0,0,.28);
      color: #fff;
      border-radius: 20px;
      padding: 16px 14px;
      border: 1px solid rgba(255,255,255,.08);
      z-index: 2;
    }

    .codeLabel {
      font-size: 13px;
      opacity: .8;
    }

    .codeValue {
      margin-top: 10px;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      line-height: 1;
      color: #facc15;
      text-shadow: 0 6px 20px rgba(0,0,0,.35);
    }

    .codeValue.reveal {
      animation: codePop .65s ease;
    }

    .poolCount {
      margin-top: 16px;
      text-align: center;
      color: rgba(255,255,255,.7);
      font-size: 14px;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(250,204,21,.85);
      filter: blur(.5px);
      opacity: 0;
    }

    .spark.show {
      animation: sparkle 1.2s ease-out forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%,100% { transform: scale(1); opacity: .45; }
      50% { transform: scale(1.06); opacity: .95; }
    }

    @keyframes jitter {
      0% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-1px) scale(1.01); }
      50% { transform: translateY(1px) scale(.995); }
      75% { transform: translateY(-1px) scale(1.005); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes winnerPop {
      0% { transform: scale(.85); opacity: .2; }
      45% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes codePop {
      0% { transform: scale(.7); opacity: .1; }
      55% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: translateY(0) scale(.6); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
    }

    @media (max-width: 540px) {
      h1 { font-size: 28px; }
      .winnerName { font-size: 34px; }
      .codeValue { font-size: 34px; }
      .winnerMeta { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Lucky Draw</h1>
      <div class="sub">สุ่มจากผู้ที่เช็กอินแล้วเท่านั้น และยังไม่เคยได้รางวัล</div>

      <input id="prizeName" type="text" placeholder="ชื่อรางวัล เช่น รางวัลที่ 1 / โทรศัพท์ / บัตรกำนัล" />
      <button id="drawBtn" class="drawBtn">เริ่มสุ่มผู้โชคดี</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="winnerCard" class="card" style="display:none;">
      <div class="winnerStage">
        <div id="glowRing" class="glowRing"></div>
        <div class="sparkles" id="sparkles"></div>

        <div class="winnerLabel">ผู้โชคดี</div>

        <div class="rollingBox">
          <div id="winnerName" class="winnerName">-</div>
        </div>

        <div id="winnerMeta" class="winnerMeta">-</div>

        <div class="codeBox">
          <div class="codeLabel">รหัสรับสิทธิ์</div>
          <div id="winnerCode" class="codeValue">----</div>
        </div>

        <div id="poolCount" class="poolCount">จำนวนผู้มีสิทธิ์สุ่ม: 0 คน</div>

        <button id="confirmBtn" class="confirmBtn">ยืนยันมอบรางวัล</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";
    const STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";
    const STAFF_NAME = "LUCKY_DRAW_STAFF";

    const prizeNameEl = document.getElementById("prizeName");
    const drawBtn = document.getElementById("drawBtn");
    const confirmBtn = document.getElementById("confirmBtn");
    const msgEl = document.getElementById("msg");
    const winnerCard = document.getElementById("winnerCard");
    const winnerNameEl = document.getElementById("winnerName");
    const winnerMetaEl = document.getElementById("winnerMeta");
    const winnerCodeEl = document.getElementById("winnerCode");
    const poolCountEl = document.getElementById("poolCount");
    const glowRingEl = document.getElementById("glowRing");
    const sparklesEl = document.getElementById("sparkles");

    let currentWinner = null;
    let rollingTimer = null;

    function setMsg(text, type = "") {
      msgEl.className = "msg " + type;
      msgEl.textContent = text || "";
    }

    function randomThaiLikeName() {
      const first = ["สมชาย","วิทยา","อนันต์","ภาณุ","สุเมธ","อรทัย","ปาริชาติ","จิราภา","กัญญา","ศิริพร","ธนพล","ปิยะ","มารุต","อธิวัฒน์"];
      const last = ["ใจดี","รุ่งเรือง","บุญมี","ทองคำ","แสงดาว","ศรีสุข","ท้วมกลัด","โชติช่วง","เจริญผล","มั่งคั่ง","วัฒนา","กิจไพศาล"];
      return first[Math.floor(Math.random() * first.length)] + " " + last[Math.floor(Math.random() * last.length)];
    }

    function startRollingVisual() {
      winnerCard.style.display = "block";
      confirmBtn.classList.remove("show");
      winnerNameEl.className = "winnerName rolling";
      winnerCodeEl.className = "codeValue";
      glowRingEl.classList.add("active");

      let tick = 0;
      rollingTimer = setInterval(() => {
        tick++;
        winnerNameEl.textContent = randomThaiLikeName();
        winnerMetaEl.innerHTML = "กำลังสุ่มผู้โชคดี...";
        winnerCodeEl.textContent = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
      }, 90);

      return new Promise((resolve) => {
        setTimeout(() => {
          clearInterval(rollingTimer);
          resolve();
        }, 2600);
      });
    }

    function burstSparkles() {
      sparklesEl.innerHTML = "";
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("span");
        s.className = "spark show";
        s.style.left = (10 + Math.random() * 80) + "%";
        s.style.top = (55 + Math.random() * 18) + "%";
        s.style.animationDelay = (Math.random() * 0.25) + "s";
        sparklesEl.appendChild(s);
      }
    }

    function renderWinner(winner, totalEligible) {
      currentWinner = winner;

      winnerNameEl.className = "winnerName reveal";
      winnerNameEl.textContent = winner.final_name || "-";

      winnerMetaEl.innerHTML =
        `เบอร์: ${winner.phone || "-"}<br>` +
        `รางวัล: ${prizeNameEl.value.trim() || "-"}`;

      winnerCodeEl.className = "codeValue reveal";
      winnerCodeEl.textContent = winner.claim_code || "----";

      poolCountEl.textContent = `จำนวนผู้มีสิทธิ์สุ่ม: ${totalEligible || 0} คน`;
      glowRingEl.classList.remove("active");
      burstSparkles();
      confirmBtn.classList.add("show");
    }

    async function drawWinner() {
      const prizeName = prizeNameEl.value.trim();
      if (!prizeName) {
        setMsg("กรุณาระบุชื่อรางวัลก่อน", "err");
        return;
      }

      try {
        drawBtn.disabled = true;
        confirmBtn.disabled = true;
        setMsg("กำลังสุ่ม...");
        await startRollingVisual();

        const res = await fetch(`${API_URL}?action=lucky_draw_pick`);
        const data = await res.json();

        if (!data.ok) {
          winnerCard.style.display = "none";
          setMsg(data.message || "สุ่มไม่สำเร็จ", "err");
          return;
        }

        renderWinner(data.winner, data.total_eligible);
        setMsg("สุ่มสำเร็จ", "ok");
        confirmBtn.disabled = false;
      } catch (err) {
        winnerCard.style.display = "none";
        setMsg("เชื่อมต่อระบบไม่สำเร็จ", "err");
      } finally {
        drawBtn.disabled = false;
      }
    }

    async function confirmWinner() {
      const prizeName = prizeNameEl.value.trim();
      if (!currentWinner) {
        setMsg("ยังไม่มีผู้โชคดี", "err");
        return;
      }
      if (!prizeName) {
        setMsg("กรุณาระบุชื่อรางวัล", "err");
        return;
      }

      try {
        confirmBtn.disabled = true;
        setMsg("กำลังบันทึกผล...");

        const url =
          `${API_URL}?action=confirm_prize_winner` +
          `&row=${encodeURIComponent(currentWinner.row)}` +
          `&prize_name=${encodeURIComponent(prizeName)}` +
          `&staff=${encodeURIComponent(STAFF_NAME)}` +
          `&staff_token=${encodeURIComponent(STAFF_TOKEN)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          setMsg(data.message || "บันทึกผลไม่สำเร็จ", "err");
          return;
        }

        setMsg(`ยืนยันผู้ได้รับรางวัลแล้ว: ${prizeName}`, "ok");
      } catch (err) {
        setMsg("เชื่อมต่อระบบไม่สำเร็จ", "err");
      } finally {
        confirmBtn.disabled = false;
      }
    }

    drawBtn.addEventListener("click", drawWinner);
    confirmBtn.addEventListener("click", confirmWinner);
  </script>
</body>
</html>
