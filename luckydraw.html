<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lucky Draw</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#111827;
  color:#fff;
}

.wrap {
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1 {
  text-align:center;
  font-size:34px;
  margin-bottom:10px;
}

.sub {
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

/* ปุ่มรางวัล */
.prize-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:16px;
}

.prize-btn {
  padding:14px;
  border-radius:14px;
  border:1px solid #333;
  background:#1f2937;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.prize-btn.active {
  background:#facc15;
  color:#000;
}

/* ปุ่มสุ่ม */
.drawBtn {
  width:100%;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  background:#22c55e;
  color:#000;
  cursor:pointer;
}

/* stage */
.stage {
  margin-top:20px;
  padding:30px;
  border-radius:20px;
  background:#000;
  text-align:center;
}

.name {
  font-size:42px;
  font-weight:900;
  margin:20px 0;
}

.code {
  font-size:36px;
  letter-spacing:6px;
  color:#facc15;
}

/* confirm */
.confirmBtn {
  margin-top:20px;
  padding:14px;
  width:100%;
  font-size:18px;
  border-radius:14px;
  border:none;
  background:#8b5cf6;
  color:#fff;
  display:none;
}

.confirmBtn.show {
  display:block;
}
</style>
</head>

<body>
<div class="wrap">

<h1>Lucky Draw</h1>
<div class="sub">เลือกของรางวัล แล้วกดสุ่ม</div>

<!-- ปุ่มรางวัล -->
<div class="prize-grid" id="prizeGrid"></div>

<button class="drawBtn" id="drawBtn">เริ่มสุ่ม</button>

<div class="stage" id="stage" style="display:none;">
  <div id="prizeLabel"></div>
  <div class="name" id="name">-</div>
  <div class="code" id="code">----</div>

  <button class="confirmBtn" id="confirmBtn">ยืนยันผู้ชนะ</button>
</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxZoooaEtBsLKUm3ppv-AIVipnC2w2WptAx5YHYwkfLZSTwIuMT7NRy0nHGZjY-AjSF/exec";
const STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";

/* =======================
   🔥 แก้รางวัลตรงนี้
======================= */
const PRIZES = [
  "รางวัลที่ 1",
  "รางวัลที่ 2",
  "Power Bank",
  "บัตรกำนัล",
  "ของที่ระลึก",
  "รางวัลพิเศษ"
];

let selectedPrize = null;
let winner = null;

/* render ปุ่ม */
const grid = document.getElementById("prizeGrid");

PRIZES.forEach(p => {
  const btn = document.createElement("button");
  btn.className = "prize-btn";
  btn.innerText = p;

  btn.onclick = () => {
    document.querySelectorAll(".prize-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedPrize = p;
  };

  grid.appendChild(btn);
});

/* random fake */
function fakeName(){
  const names=["สมชาย","วิทยา","อนันต์","ปาริชาติ","อรทัย","ศิริพร"];
  const last=["ใจดี","ทองดี","รุ่งเรือง","มั่งมี","ศรีสุข"];
  return names[Math.floor(Math.random()*names.length)]+" "+last[Math.floor(Math.random()*last.length)];
}

/* rolling */
async function startRolling(){
  const nameEl = document.getElementById("name");
  const codeEl = document.getElementById("code");

  return new Promise(resolve=>{
    const t = setInterval(()=>{
      nameEl.innerText = fakeName();
      codeEl.innerText = Math.floor(Math.random()*10000).toString().padStart(4,"0");
    },80);

    setTimeout(()=>{
      clearInterval(t);
      resolve();
    },2500);
  });
}

/* draw */
document.getElementById("drawBtn").onclick = async () => {

  if(!selectedPrize){
    alert("เลือกรางวัลก่อน");
    return;
  }

  document.getElementById("stage").style.display="block";
  document.getElementById("confirmBtn").classList.remove("show");

  await startRolling();

  const res = await fetch(API_URL+"?action=lucky_draw_pick");
  const data = await res.json();

  if(!data.ok){
    alert("สุ่มไม่ได้");
    return;
  }

  winner = data.winner;

  document.getElementById("name").innerText = winner.final_name;
  document.getElementById("code").innerText = winner.claim_code;
  document.getElementById("prizeLabel").innerText = "🎁 "+selectedPrize;

  document.getElementById("confirmBtn").classList.add("show");
};

/* confirm */
document.getElementById("confirmBtn").onclick = async () => {

  const url = API_URL +
    "?action=confirm_prize_winner" +
    "&row="+winner.row +
    "&prize_name="+encodeURIComponent(selectedPrize) +
    "&staff=STAFF" +
    "&staff_token="+STAFF_TOKEN;

  const res = await fetch(url);
  const data = await res.json();

  if(data.ok){
    alert("ยืนยันแล้ว");
  }else{
    alert(data.message);
  }
};
</script>
</body>
</html>
