<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>เช็กอินเข้างาน</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }
    .sub {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    input, button {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      font-size: 18px;
    }
    input {
      border: 1px solid #ddd;
      padding: 0 14px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250,204,21,.18);
    }
    button {
      border: 0;
      background: #facc15;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: #ddd;
      color: #777;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 14px;
      font-size: 15px;
      text-align: center;
      min-height: 22px;
    }
    .err { color: #c62828; }
    .ok { color: #137333; }

    .list {
      margin-top: 18px;
    }
    .item {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }
    .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .vip {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff4c2;
      font-size: 12px;
      font-weight: 700;
    }
    .item button {
      margin-top: 12px;
      min-height: 46px;
      font-size: 16px;
    }

    .success {
      text-align: center;
      padding: 14px 0 4px;
    }
    .successIcon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #e8f5e9;
      color: #137333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 16px;
      font-weight: 700;
    }
    .success h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .success p {
      margin: 0;
      color: #666;
      line-height: 1.6;
      font-size: 16px;
    }
    .backBtn {
      margin-top: 20px;
      background: #111;
      color: #fff;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <div id="searchView">
        <h1>เช็กอินเข้างาน</h1>
        <div class="sub">
          กรุณากรอกเบอร์โทรศัพท์ที่ใช้ลงทะเบียน
        </div>

        <input id="phone" type="tel" inputmode="numeric" placeholder="เบอร์โทรศัพท์" />
        <button id="searchBtn">ค้นหา</button>

        <div id="msg" class="msg"></div>
        <div id="results" class="list"></div>
      </div>

      <div id="successView" class="hidden">
        <div class="success">
          <div class="successIcon">✓</div>
          <h2>เช็กอินเรียบร้อย</h2>
          <p id="successText">ขอบคุณที่ลงทะเบียนเข้าร่วมงาน</p>
          <button class="backBtn" onclick="resetPage()">กลับหน้าแรก</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzhAcFHWotDgy8fobhhTbYJ0p7UCnRBbp7xi9BC6gZj1PpygZOjJ4OH92l5aIhA4WeyNg/exec";
    const STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";
    const STAFF_NAME = "SELF_CHECKIN";

    const phoneEl = document.getElementById("phone");
    const searchBtn = document.getElementById("searchBtn");
    const msgEl = document.getElementById("msg");
    const resultsEl = document.getElementById("results");
    const searchView = document.getElementById("searchView");
    const successView = document.getElementById("successView");
    const successText = document.getElementById("successText");

    function normalizePhone(value) {
      return String(value || "").replace(/[^\d]/g, "");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setMsg(text, type = "") {
      msgEl.className = "msg " + type;
      msgEl.textContent = text || "";
    }

    function resetPage() {
      successView.classList.add("hidden");
      searchView.classList.remove("hidden");
      phoneEl.value = "";
      resultsEl.innerHTML = "";
      setMsg("");
      phoneEl.focus();
    }

    function showSuccess(name) {
      successText.textContent = `คุณ ${name} เช็กอินเรียบร้อยแล้ว`;
      searchView.classList.add("hidden");
      successView.classList.remove("hidden");
    }

    function renderOne(item) {
      const vipHtml = item.tag ? `<div class="vip">${escapeHtml(item.tag)}</div>` : "";
      const checkedHtml = item.checked_in
        ? `<div class="meta" style="color:#137333;margin-top:8px;">เช็กอินแล้ว ${item.checkin_time ? `(${escapeHtml(item.checkin_time)})` : ""}</div>`
        : "";

      return `
        <div class="item">
          <div class="name">${escapeHtml(item.final_name || "-")}</div>
          <div class="meta">
            เบอร์: ${escapeHtml(item.phone || "-")}
          </div>
          ${vipHtml}
          ${checkedHtml}
          <button ${item.checked_in ? "disabled" : ""} onclick='checkinOne(${JSON.stringify(item)})'>
            ${item.checked_in ? "เช็กอินแล้ว" : "เช็กอิน"}
          </button>
        </div>
      `;
    }

    async function searchAttendees() {
      const phone = normalizePhone(phoneEl.value);
      if (!phone) {
        setMsg("กรุณากรอกเบอร์โทรศัพท์", "err");
        return;
      }

      setMsg("กำลังค้นหา...");
      resultsEl.innerHTML = "";

      const url = `${API_URL}?action=search_attendees&phone=${encodeURIComponent(phone)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          setMsg(data.message || "ค้นหาไม่สำเร็จ", "err");
          return;
        }

        if (!data.attendees || !data.attendees.length) {
          setMsg("ไม่พบข้อมูลลงทะเบียน", "err");
          return;
        }

        setMsg("");

        if (data.attendees.length === 1) {
          resultsEl.innerHTML = renderOne(data.attendees[0]);
          return;
        }

        resultsEl.innerHTML = data.attendees.map(renderOne).join("");
      } catch (err) {
        setMsg("เชื่อมต่อระบบไม่สำเร็จ", "err");
      }
    }

    async function checkinOne(item) {
      const url =
        `${API_URL}?action=checkin_attendee` +
        `&phone=${encodeURIComponent(item.phone)}` +
        `&name=${encodeURIComponent(item.final_name)}` +
        `&row=${encodeURIComponent(item.row)}` +
        `&staff=${encodeURIComponent(STAFF_NAME)}` +
        `&staff_token=${encodeURIComponent(STAFF_TOKEN)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          alert(data.message || "เช็กอินไม่สำเร็จ");
          return;
        }

        showSuccess(item.final_name);
      } catch (err) {
        alert("ระบบเช็กอินมีปัญหา");
      }
    }

    searchBtn.addEventListener("click", searchAttendees);

    phoneEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchAttendees();
    });
  </script>
</body>
</html>
