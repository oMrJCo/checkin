<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>เช็กอินเข้างาน</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    .wrap {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .card {
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
    }

    .sub {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      border-radius: 14px;
      font-size: 18px;
    }

    input {
      min-height: 54px;
      border: 1px solid #ddd;
      padding: 0 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250,204,21,.18);
    }

    button {
      min-height: 48px;
      border: 0;
      background: #facc15;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .searchBtn {
      margin-top: 12px;
      min-height: 50px;
      font-size: 18px;
    }

    .msg {
      margin-top: 14px;
      min-height: 22px;
      text-align: center;
      font-size: 15px;
    }

    .err { color: #c62828; }
    .ok { color: #137333; }

    .list {
      margin-top: 18px;
    }

    .item {
      border: 1px solid #e3e3e3;
      border-radius: 18px;
      padding: 16px 14px;
      margin-top: 12px;
      background: #fff;
    }

    .item.checked {
      background: #f8faf8;
      border-color: #d7eadb;
    }

    .name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .meta {
      font-size: 14px;
      color: #666;
      line-height: 1.55;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-vip {
      background: #fff4c2;
      color: #5d4600;
    }

    .badge-checked {
      background: #e8f5e9;
      color: #137333;
    }

    .checkedTime {
      margin-top: 10px;
      font-size: 14px;
      color: #137333;
      font-weight: 700;
      line-height: 1.5;
    }

    .itemBtn {
      margin-top: 14px;
      min-height: 48px;
      font-size: 18px;
    }

    .itemBtn.checkedBtn {
      background: #101010;
      color: #fff;
    }

    .success {
      text-align: center;
      padding: 10px 4px 6px;
    }

    .successIcon {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #e7f1e7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 48px;
      font-weight: 700;
      color: #137333;
    }

    .successTitle {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }

    .successName {
      margin-top: 16px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 800;
      color: #111;
      word-break: break-word;
    }

    .successDesc {
      margin-top: 14px;
      font-size: 17px;
      color: #666;
      line-height: 1.6;
    }

    .backBtn {
      margin-top: 22px;
      min-height: 50px;
      background: #111;
      color: #fff;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .wrap {
        padding: 10px;
      }

      .card {
        padding: 18px 14px;
        border-radius: 18px;
      }

      h1 {
        font-size: 28px;
      }

      .name {
        font-size: 17px;
      }

      .successTitle {
        font-size: 26px;
      }

      .successName {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <div id="searchView">
        <h1>เช็กอินเข้างาน</h1>
        <div class="sub">กรุณากรอกเบอร์โทรศัพท์ที่ใช้ลงทะเบียน</div>

        <input id="phone" type="tel" inputmode="numeric" placeholder="เบอร์โทรศัพท์" />
        <button id="searchBtn" class="searchBtn">ค้นหา</button>

        <div id="msg" class="msg"></div>
        <div id="results" class="list"></div>
      </div>

      <div id="successView" class="hidden">
        <div class="success">
          <div class="successIcon">✓</div>
          <h2 class="successTitle">เช็กอินเรียบร้อย</h2>
          <div id="successName" class="successName">-</div>
          <div class="successDesc">ขอบคุณสำหรับการลงทะเบียนเข้าร่วมงาน</div>
          <button class="backBtn" onclick="resetPage()">กลับหน้าแรก</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzhAcFHWotDgy8fobhhTbYJ0p7UCnRBbp7xi9BC6gZj1PpygZOjJ4OH92l5aIhA4WeyNg/exec";
    const STAFF_TOKEN = "LEEPLUS_CHECKIN_2026";
    const STAFF_NAME = "SELF_CHECKIN";

    const phoneEl = document.getElementById("phone");
    const searchBtn = document.getElementById("searchBtn");
    const msgEl = document.getElementById("msg");
    const resultsEl = document.getElementById("results");
    const searchView = document.getElementById("searchView");
    const successView = document.getElementById("successView");
    const successNameEl = document.getElementById("successName");

    function normalizePhone(value) {
      return String(value || "").replace(/[^\d]/g, "");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setMsg(text, type = "") {
      msgEl.className = "msg " + type;
      msgEl.textContent = text || "";
    }

    function resetPage() {
      successView.classList.add("hidden");
      searchView.classList.remove("hidden");
      phoneEl.value = "";
      resultsEl.innerHTML = "";
      setMsg("");
      phoneEl.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showSuccess(name) {
      successNameEl.textContent = name || "-";
      searchView.classList.add("hidden");
      successView.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderOne(item) {
      const checked = !!item.checked_in;
      const badges = [];

      if (item.tag) {
        badges.push(`<span class="badge badge-vip">${escapeHtml(item.tag)}</span>`);
      }

      if (checked) {
        badges.push(`<span class="badge badge-checked">เช็กอินแล้ว</span>`);
      }

      const checkedTimeHtml = checked
        ? `<div class="checkedTime">เช็กอินแล้ว${item.checkin_time ? ` เวลา ${escapeHtml(item.checkin_time)}` : ""}</div>`
        : "";

      return `
        <div class="item ${checked ? "checked" : ""}">
          <div class="name">${escapeHtml(item.final_name || "-")}</div>
          <div class="meta">เบอร์: ${escapeHtml(item.phone || "-")}</div>
          ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
          ${checkedTimeHtml}
          <button
            class="itemBtn ${checked ? "checkedBtn" : ""}"
            ${checked ? "disabled" : ""}
            onclick='checkinOne(${JSON.stringify(item)})'
          >
            ${checked ? "เช็กอินแล้ว" : "เช็กอิน"}
          </button>
        </div>
      `;
    }

    async function searchAttendees() {
      const phone = normalizePhone(phoneEl.value);

      if (!phone) {
        setMsg("กรุณากรอกเบอร์โทรศัพท์", "err");
        return;
      }

      setMsg("กำลังค้นหา...");
      resultsEl.innerHTML = "";

      const url = `${API_URL}?action=search_attendees&phone=${encodeURIComponent(phone)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          setMsg(data.message || "ค้นหาไม่สำเร็จ", "err");
          return;
        }

        if (!data.attendees || !data.attendees.length) {
          setMsg("ไม่พบข้อมูลลงทะเบียน", "err");
          return;
        }

        setMsg("");
        resultsEl.innerHTML = data.attendees.map(renderOne).join("");
      } catch (err) {
        setMsg("เชื่อมต่อระบบไม่สำเร็จ", "err");
      }
    }

    async function checkinOne(item) {
      const url =
        `${API_URL}?action=checkin_attendee` +
        `&phone=${encodeURIComponent(item.phone)}` +
        `&name=${encodeURIComponent(item.final_name)}` +
        `&row=${encodeURIComponent(item.row)}` +
        `&staff=${encodeURIComponent(STAFF_NAME)}` +
        `&staff_token=${encodeURIComponent(STAFF_TOKEN)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          alert(data.message || "เช็กอินไม่สำเร็จ");
          return;
        }

        showSuccess(item.final_name);
      } catch (err) {
        alert("ระบบเช็กอินมีปัญหา");
      }
    }

    searchBtn.addEventListener("click", searchAttendees);

    phoneEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchAttendees();
    });
  </script>
</body>
</html>
